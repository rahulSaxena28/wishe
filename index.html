<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Friendship Day</title>

<!--
  ══════════════════════════════════════════════════════════
  QUICK CUSTOMIZE — edit these 4 lines and you're done.
  ══════════════════════════════════════════════════════════
-->
<script>
  window.CONFIG = {
    FRIEND_NAME: "Nishu ma'am",                 // her name
    MESSAGE: "Itne saalon baad tumse dobara baat karke accha laga. Life mein log aate-jaate rehte hain, par kuch connections waapas jud jaate hain aur wahi sabse khaas hote hain. Happy Friendship Day !",
    PHOTO_URL: "",                        // paste an image URL, or leave "" to skip
    MUSIC_URL: "",                        // paste an mp3 URL, or leave "" to skip
    PIN: "41203"                           // set any 4+ digit PIN she'll know (e.g. her birthday)
  };
</script>

<style>
  :root{
    --plum: #2E1B33;
    --plum-deep: #1B0F20;
    --coral: #FF6B5B;
    --gold: #FFC24B;
    --teal: #3FBFA8;
    --cream: #FFF6EA;
    --thread-w: 10px;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  html,body{
    min-height:100%;
    background: radial-gradient(120% 100% at 50% 0%, var(--plum) 0%, var(--plum-deep) 65%);
    color: var(--cream);
    font-family: 'Poppins', -apple-system, sans-serif;
    overflow-x:hidden;
  }

  @font-face{
    font-family:'Fredoka';
    src: local('Fredoka');
  }

  /* ---------- PIN gate ---------- */
  #pinScreen{
    position:fixed; inset:0;
    background: var(--plum-deep);
    z-index: 1000;
    display:flex; align-items:center; justify-content:center;
    transition: opacity 0.5s ease, visibility 0.5s ease;
  }
  #pinScreen.hidden{ opacity:0; visibility:hidden; pointer-events:none; }
  .pin-box{
    text-align:center;
    width: 260px;
  }
  .pin-box .icon{ font-size:34px; margin-bottom:10px; }
  .pin-box h2{
    font-family:'Fredoka', sans-serif;
    font-size:1.3rem;
    color: var(--gold);
    margin-bottom:6px;
  }
  .pin-box p{
    font-size:13px;
    color: rgba(255,246,234,0.55);
    margin-bottom:20px;
  }
  #pinInput{
    width:100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid rgba(255,246,234,0.25);
    background: rgba(255,246,234,0.07);
    color: var(--cream);
    font-size: 1.1rem;
    text-align:center;
    letter-spacing: 4px;
    outline:none;
  }
  #pinInput:focus{ border-color: var(--coral); }
  #pinSubmit{
    margin-top: 14px;
    width:100%;
    padding: 11px;
    border-radius: 10px;
    border:none;
    background: linear-gradient(90deg, var(--coral), var(--gold));
    color: var(--plum-deep);
    font-weight:600;
    cursor:pointer;
    font-size: 0.95rem;
  }
  #pinError{
    margin-top:10px;
    font-size:12px;
    color: var(--coral);
    min-height: 16px;
  }

  main{ display:none; }
  main.unlocked{ display:block; }


  #braidScreen{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background: var(--plum-deep);
    z-index: 999;
    transition: opacity 0.7s ease, visibility 0.7s ease;
  }
  #braidScreen.done{ opacity:0; visibility:hidden; pointer-events:none; }
  #braidScreen.hidden{ display:none; }

  .braid-wrap{ position:relative; width:220px; height:160px; }
  .thread{
    position:absolute; top:0; left:50%;
    width: var(--thread-w); height:100%;
    border-radius: 6px;
    transform-origin: top center;
    animation: weave 1.8s ease-in-out infinite;
  }
  .thread.c1{ background: var(--coral); animation-delay: 0s; }
  .thread.c2{ background: var(--gold); animation-delay: 0.15s; }
  .thread.c3{ background: var(--teal); animation-delay: 0.3s; }

  @keyframes weave{
    0%   { transform: translateX(-46px) rotate(-14deg); }
    50%  { transform: translateX(46px) rotate(14deg); }
    100% { transform: translateX(-46px) rotate(-14deg); }
  }

  .braid-label{
    position:absolute; bottom:-42px; left:50%; transform:translateX(-50%);
    font-size:14px; letter-spacing:2px; text-transform:uppercase;
    color: rgba(255,246,234,0.55);
    white-space:nowrap;
  }

  /* ---------- Page ---------- */
  main{
    max-width: 640px;
    margin: 0 auto;
    padding: 72px 28px 100px;
    text-align:center;
  }

  .eyebrow{
    font-size:13px;
    letter-spacing:4px;
    text-transform:uppercase;
    color: var(--gold);
    opacity:0;
    animation: rise 0.8s ease forwards 0.2s;
  }

  h1{
    font-family: 'Fredoka', 'Segoe UI', sans-serif;
    font-weight: 700;
    font-size: clamp(2.4rem, 8vw, 4rem);
    line-height:1.05;
    margin: 14px 0 6px;
    background: linear-gradient(90deg, var(--coral), var(--gold));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    opacity:0;
    animation: rise 0.9s ease forwards 0.45s;
  }

  .to-name{
    font-size: clamp(1.1rem, 4vw, 1.5rem);
    color: var(--cream);
    opacity:0;
    animation: rise 0.9s ease forwards 0.7s;
    margin-bottom: 40px;
  }
  .to-name b{ color: var(--teal); font-weight:600; }

  @keyframes rise{
    from{ opacity:0; transform: translateY(14px); }
    to{ opacity:1; transform: translateY(0); }
  }

  /* photo */
  .photo-frame{
    width: 220px; height:220px;
    margin: 0 auto 38px;
    border-radius: 50%;
    padding: 6px;
    background: conic-gradient(var(--coral), var(--gold), var(--teal), var(--coral));
    opacity:0;
    animation: rise 0.9s ease forwards 0.9s;
  }
  .photo-frame img{
    width:100%; height:100%; object-fit:cover; border-radius:50%;
    display:block;
    border: 4px solid var(--plum-deep);
  }

  /* message card */
  .message-card{
    text-align:left;
    background: rgba(255,246,234,0.05);
    border: 1px solid rgba(255,246,234,0.12);
    border-radius: 18px;
    padding: 30px 26px;
    position:relative;
    min-height: 140px;
    opacity:0;
    animation: rise 0.9s ease forwards 1.05s;
  }
  .message-card::before{
    content:'"';
    font-family:'Fredoka', sans-serif;
    position:absolute; top:-6px; left:18px;
    font-size:64px; color: var(--coral); opacity:0.4;
  }
  #typedMessage{
    font-size: 1.05rem;
    line-height:1.7;
    color: var(--cream);
  }
  .cursor{
    display:inline-block; width:2px; height:1.1em;
    background: var(--gold);
    margin-left:2px;
    vertical-align: middle;
    animation: blink 0.9s step-end infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  /* sign-off */
  .signoff{
    margin-top: 34px;
    font-family:'Fredoka', sans-serif;
    font-size: 1.3rem;
    color: var(--gold);
    opacity:0;
  }
  .signoff.show{ animation: rise 0.7s ease forwards; }

  /* sound toggle */
  #soundToggle{
    position: fixed; top:20px; right:20px; z-index: 50;
    background: rgba(255,246,234,0.1);
    border: 1px solid rgba(255,246,234,0.25);
    color: var(--cream);
    width:46px; height:46px; border-radius:50%;
    font-size:18px; cursor:pointer;
    display:none;
    align-items:center; justify-content:center;
    transition: background 0.2s;
  }
  #soundToggle:hover{ background: rgba(255,246,234,0.2); }

  canvas#confettiCanvas{
    position:fixed; inset:0; pointer-events:none; z-index: 40;
  }

  footer{
    text-align:center;
    font-size:12px;
    color: rgba(255,246,234,0.35);
    padding-bottom: 30px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>

<div id="pinScreen">
  <div class="pin-box">
    <div class="icon">🔒</div>
    <h2>This one's just for you</h2>
    <p>Enter the PIN to open it</p>
    <input type="password" id="pinInput" inputmode="numeric" maxlength="8" placeholder="••••">
    <button id="pinSubmit">Unlock</button>
    <div id="pinError"></div>
  </div>
</div>

<div id="braidScreen" class="hidden">
  <div class="braid-wrap">
    <div class="thread c1"></div>
    <div class="thread c2"></div>
    <div class="thread c3"></div>
    <div class="braid-label">Weaving something for you…</div>
  </div>
</div>

<canvas id="confettiCanvas"></canvas>
<button id="soundToggle" title="Toggle music">🔈</button>

<main>
  <div class="eyebrow">A little thread, just for you</div>
  <h1>Happy Friendship&nbsp;Day</h1>
  <div class="to-name">To an old friend, <b id="nameSlot"></b> 👋</div>

  <div class="photo-frame" id="photoFrame" style="display:none;">
    <img id="photoImg" src="" alt="Us">
  </div>

  <div class="message-card">
    <p id="typedMessage"></p>
  </div>

  <div class="signoff" id="signoff">— glad we found our way back</div>
</main>

<footer>made with a little bit of code and a lot of gratitude</footer>

<audio id="bgMusic" loop></audio>

<script>
(function(){
  const cfg = window.CONFIG;

  document.getElementById('nameSlot').textContent = cfg.FRIEND_NAME || "friend";

  if(cfg.PHOTO_URL){
    document.getElementById('photoImg').src = cfg.PHOTO_URL;
    document.getElementById('photoFrame').style.display = 'block';
  }

  if(cfg.MUSIC_URL){
    const audio = document.getElementById('bgMusic');
    audio.src = cfg.MUSIC_URL;
    const btn = document.getElementById('soundToggle');
    btn.style.display = 'flex';
    let playing = false;
    btn.addEventListener('click', () => {
      if(playing){ audio.pause(); btn.textContent = '🔈'; }
      else { audio.play().catch(()=>{}); btn.textContent = '🔊'; }
      playing = !playing;
    });
  }

  // basic deterrents (does NOT block screenshots — that's not possible from a webpage)
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('selectstart', e => e.preventDefault());
  document.body.style.userSelect = 'none';

  // ---- PIN gate ----
  const pinScreen = document.getElementById('pinScreen');
  const pinInput = document.getElementById('pinInput');
  const pinSubmit = document.getElementById('pinSubmit');
  const pinError = document.getElementById('pinError');
  const braidScreen = document.getElementById('braidScreen');
  const main = document.querySelector('main');

  function tryUnlock(){
    if(pinInput.value === cfg.PIN){
      pinScreen.classList.add('hidden');
      braidScreen.classList.remove('hidden');
      main.classList.add('unlocked');
      setTimeout(() => {
        braidScreen.classList.add('done');
        startTyping();
        launchConfetti();
      }, 1500);
    } else {
      pinError.textContent = "Galat PIN, dobara try karo.";
      pinInput.value = "";
      pinInput.focus();
    }
  }

  pinSubmit.addEventListener('click', tryUnlock);
  pinInput.addEventListener('keydown', e => { if(e.key === 'Enter') tryUnlock(); });
  window.addEventListener('load', () => pinInput.focus());

  // typewriter
  function startTyping(){
    const el = document.getElementById('typedMessage');
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    const text = cfg.MESSAGE || "";
    let i = 0;
    el.appendChild(cursor);
    function tick(){
      if(i < text.length){
        el.insertBefore(document.createTextNode(text[i]), cursor);
        i++;
        setTimeout(tick, 22);
      } else {
        cursor.remove();
        const signoff = document.getElementById('signoff');
        signoff.classList.add('show');
      }
    }
    tick();
  }

  // lightweight confetti, no external libs
  function launchConfetti(){
    const canvas = document.getElementById('confettiCanvas');
    const ctx = canvas.getContext('2d');
    function resize(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    resize();
    window.addEventListener('resize', resize);

    const colors = ['#FF6B5B', '#FFC24B', '#3FBFA8', '#FFF6EA'];
    const pieces = Array.from({length: 140}, () => ({
      x: Math.random() * canvas.width,
      y: -20 - Math.random() * canvas.height * 0.5,
      w: 6 + Math.random() * 6,
      h: 8 + Math.random() * 10,
      color: colors[Math.floor(Math.random()*colors.length)],
      speed: 2 + Math.random() * 3,
      drift: (Math.random() - 0.5) * 2,
      rot: Math.random() * 360,
      rotSpeed: (Math.random() - 0.5) * 8
    }));

    let frame = 0;
    const maxFrames = 420; // ~7s at 60fps
    function draw(){
      ctx.clearRect(0,0,canvas.width, canvas.height);
      pieces.forEach(p => {
        p.y += p.speed;
        p.x += p.drift;
        p.rot += p.rotSpeed;
        if(p.y > canvas.height + 20){ p.y = -20; p.x = Math.random() * canvas.width; }
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot * Math.PI / 180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
        ctx.restore();
      });
      frame++;
      if(frame < maxFrames){
        requestAnimationFrame(draw);
      } else {
        ctx.clearRect(0,0,canvas.width, canvas.height);
      }
    }
    draw();
  }
})();
</script>

</body>
</html>
